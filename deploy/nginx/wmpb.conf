# wechat-mp-bot 后台 —— 共享 nginx 的一段 vhost
#
# 这份文件是**仓库内的记录**，不是被挂载的配置。真正生效的是宿主机上
# /opt/jianjian/deploy/nginx/nginx.conf 里同名的一段（由 deploy/deploy.sh
# 合并进去后 reload）。
#
# 合并注意（与 tidings 踩过的坑一致）：那个文件在 jianjian-nginx 容器里是
# **只读文件挂载**，必须原地覆盖（cat new > old / cp），不能用 sed -i ——
# sed -i 会换 inode，容器读到的还是旧文件，表现成「改了没生效」。
#
# 反代目标是宿主机上的进程（172.17.0.1 = docker 网桥网关），不是容器。
# 这与 bbs.(→8088) 和 img.(→9000) 的接法一致，后台服务因此不需要打成
# 容器，直接以系统进程跑在宿主机上即可。

server {
    listen 443 ssl;
    http2 on;
    server_name wmpb.jianjiange.site;
    client_max_body_size 4m;

    ssl_certificate     /etc/letsencrypt/live/wmpb.jianjiange.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wmpb.jianjiange.site/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 后台是私人工具，不希望被搜索引擎收录
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass http://172.17.0.1:8099;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 采集/生成是后台线程，但登录等接口也要留足时间
        proxy_read_timeout 120s;
    }
}

server {
    listen 80;
    server_name wmpb.jianjiange.site;
    return 301 https://$host$request_uri;
}
